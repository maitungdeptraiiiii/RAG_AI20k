# ── Đã đọc, không làm rule (không kiểm được trên văn bản hợp đồng, hoặc mặc định):
# Luật Đ23.1 (hình thức theo BLDS), Đ23.2 + NĐ 55/2024 Đ6 (tiếng Việt, cỡ chữ tối thiểu 12, màu chữ tương phản: không đọc
#   được từ văn bản đã số hóa), Đ23.3.e (quyền và nghĩa vụ: mọi hợp đồng đều có câu nêu nghĩa vụ), Đ24 (giải thích có lợi cho
#   người tiêu dùng: quy tắc khi tranh chấp; điều khoản trái ở Đ25.8), Đ25.15 (trái nguyên tắc thiện chí: tiêu chí chung, không
#   kiểm được bằng một dữ kiện), Đ26–27 (thời gian nghiên cứu, lưu giữ, công khai: sự kiện ngoài văn bản), Đ28 + NĐ 55/2024
#   Đ7–16 + QĐ 07/2024/QĐ-TTg (đăng ký hợp đồng theo mẫu: thủ tục hành chính; danh mục nằm ở phụ lục chưa tải được, K.2),
#   Đ29 (hóa đơn, chứng từ), Đ37–38 (giao dịch từ xa: nghĩa vụ cung cấp thông tin), Đ41.2 và Đ42.3 ('trừ trường hợp các
#   bên có thỏa thuận khác'), Đ42.1 (lập văn bản, đưa 01 bản: sự kiện), Đ67.1 (thông báo điều khoản trọng tài: sự kiện).
# Hợp đồng ký trước 01/07/2024 theo Luật BVQLNTD 59/2010/QH12 (chưa tải); gói không phân kỳ.
