    - {facts: {appendix_contradicts_contract: true, parties_accepted_change: false}, expected: FAIL}
    - {facts: {appendix_contradicts_contract: true}, expected: UNKNOWN, why: "chưa biết các bên có chấp nhận phụ lục không"}
