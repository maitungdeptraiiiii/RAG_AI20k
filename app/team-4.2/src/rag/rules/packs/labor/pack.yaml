# Gói luật lao động: những gì lõi rule engine cần biết về lĩnh vực này.
# Khái niệm và rule nằm ở concepts.yaml cùng thư mục. Thiết kế: docs/superpowers/specs/2026-11-22-rete-rule-engine-design.md §5.5.
id: labor
version: "0.1"
extends: []
document_kinds: [labor_contract]

units: [day, workday, week, month, hour, minute, percent, vnd, count]
# Quy đổi về đơn vị gốc: giá trị * factor. workday không quy đổi được (số ngày làm việc phụ thuộc lịch).
conversions:
  day:    {base: hour, factor: 24}
  week:   {base: hour, factor: 168}
  month:  {base: hour, factor: 720}
  hour:   {base: hour, factor: 1}
  minute: {base: hour, factor: 0.016666666666666666}

# Dữ kiện cấp hợp đồng (do facts.py trích và kiểm trích dẫn) -> đơn vị. Rule chỉ dùng các dữ kiện này được xét
# ngay cả khi LLM không gắn khái niệm cho điều khoản nào.
document_facts:
  contract_kind: null
  term_months: month
  base_salary_vnd: vnd
  has_probation: null
  probation_length: day
  probation_pay_pct: percent
  job_level: null
  sign_date: null

# Dữ kiện người dùng xác nhận.
user_facts: [work_condition, pregnant, pregnancy_month, child_under_12_months, employee_consent,
             medical_certificate, wage_region, employee_is_female,
             # Điều 20.2 BLLĐ: hợp đồng xác định thời hạn hết hạn mà người lao động vẫn làm việc
             worked_after_expiry_days,        # số ngày làm việc tiếp kể từ ngày hợp đồng hết hạn (đơn vị day)
             new_contract_signed,             # hai bên đã ký hợp đồng lao động mới chưa (bool)
             fixed_term_contract_count,       # số HĐ xác định thời hạn đã ký liên tiếp với người lao động, kể cả HĐ đang soát
             # ngoại lệ của giới hạn số lần ký HĐ xác định thời hạn (Đ20.2.c)
             is_state_enterprise_director,    # được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước
             is_elderly_employee,             # người lao động cao tuổi (Đ149.1)
             is_foreign_employee,             # người lao động nước ngoài làm việc tại Việt Nam (Đ151.2)
             is_union_leader_in_term]         # thành viên ban lãnh đạo tổ chức đại diện NLĐ tại cơ sở đang trong nhiệm kỳ (Đ177.4)

# Đơn vị mặc định khi người dùng trả lời một con số (không kèm đơn vị).
user_fact_units:
  worked_after_expiry_days: day

# Câu hỏi gợi ý cho người dùng (spec §8): `values` là miền giá trị để next_questions thử; dữ kiện người dùng không khai ở đây
# thì không được gợi ý. Dữ kiện số khai giá trị đại diện cho từng khoảng quanh ngưỡng luật.
user_fact_questions:
  pregnant: {question: "Người lao động có đang mang thai không?", values: [true, false]}
  employee_is_female: {question: "Người lao động có phải là nữ không?", values: [true, false]}
  child_under_12_months: {question: "Người lao động có đang nuôi con dưới 12 tháng tuổi không?", values: [true, false]}
  employee_consent: {question: "Người lao động có đồng ý không?", values: [true, false]}
  medical_certificate: {question: "Có giấy xác nhận của cơ sở y tế không?", values: [true, false]}
  worked_after_expiry_days:
    question: "Hợp đồng đã hết hạn mà người lao động vẫn làm việc tiếp được bao nhiêu ngày?"
    values: [10, 45]
    unit: day
  new_contract_signed: {question: "Hai bên đã ký hợp đồng lao động mới chưa?", values: [true, false]}
  fixed_term_contract_count:
    question: "Người lao động đã ký liên tiếp bao nhiêu hợp đồng xác định thời hạn (kể cả hợp đồng này)?"
    values: [1, 3]
  is_state_enterprise_director: {question: "Người lao động được thuê làm giám đốc doanh nghiệp có vốn nhà nước?", values: [true, false]}
  is_elderly_employee: {question: "Người lao động là người lao động cao tuổi?", values: [true, false]}
  is_foreign_employee: {question: "Người lao động là người nước ngoài làm việc tại Việt Nam?", values: [true, false]}
  is_union_leader_in_term: {question: "Người lao động là thành viên ban lãnh đạo tổ chức đại diện người lao động tại cơ sở, đang trong nhiệm kỳ?", values: [true, false]}

# Finding thêm ngoài tập chung của lõi (ok, violation, needs_facts, conflict, missing_content).
findings: [hidden_right, possible_right]
# on_silence ngoài `none` / `missing_content` (có sẵn trong lõi): quyền ẩn khi hợp đồng không nhắc.
silences:
  hidden_right:
    applicable: [PASS, hidden_right]
    unknown: [UNKNOWN, possible_right]

# Dữ kiện suy ra (spec §5.3). Điều 20.2.b BLLĐ: hợp đồng xác định thời hạn hết hạn, người lao động vẫn làm việc, hết 30 ngày
# kể từ ngày hết hạn mà hai bên không ký hợp đồng mới thì trở thành hợp đồng không xác định thời hạn.
derived:
  - fact: contract_kind_effective
    unit: null
    definitions:
      - id: base
        from: contract_kind
      - id: d20k2b
        exception_of: base
        when:
          all:
            - {fact: contract_kind, op: eq, value: xac_dinh_thoi_han}
            - {fact: worked_after_expiry_days, op: gt, value: 30, unit: day}
            - {fact: new_contract_signed, op: eq, value: false}
        value: khong_xac_dinh_thoi_han
        anchors: [{pid: "bo-luat:45/2019/QH14#d20.k2.b", role: basis}]
