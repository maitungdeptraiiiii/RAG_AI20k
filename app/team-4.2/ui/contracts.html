<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hợp đồng — Just-ice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --surface: #ffffff; --page: #f7f7f8; --ink: #0d0d0d; --ink-2: #525252; --hairline: #e5e5e5;
      --good-text: #006300; --warning-text: #8a5a00; --critical-text: #b42318;
    }
    body { font-family: 'Inter', sans-serif; background: var(--page); color: var(--ink); font-size: 14px; }
    .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; }
    .chip { border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: var(--ink-2); background: var(--surface); }
    .btn { background: var(--ink); color: #fff; border-radius: 10px; padding: 7px 14px; font-size: 13px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { border: 1px solid #d4d4d4; border-radius: 10px; padding: 7px 14px; font-size: 13px; background: #fff; }
    .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
    .step-dot { width: 26px; height: 26px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 600; border: 1px solid #d4d4d4; color: var(--ink-2); background: #fff; }
    .step.on .step-dot { background: var(--ink); color: #fff; border-color: var(--ink); }
    .step.done .step-dot { background: #e8f6e8; color: var(--good-text); border-color: #b9e0b9; }
    .step.locked { opacity: .45; }
    input, select, textarea { border: 1px solid #d4d4d4; border-radius: 8px; padding: 6px 9px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #737373; }
    .field-label { font-size: 11.5px; color: #737373; }
    .chip-on { background: var(--ink); color: #fff; border-color: var(--ink); }
    details[open] > summary .chev { transform: rotate(90deg); }
    .chev { display: inline-block; transition: transform .15s; }
    summary::-webkit-details-marker { display: none; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen">
  <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-neutral-200">
    <div class="max-w-[1100px] mx-auto px-4 sm:px-6 h-14 flex items-center gap-3">
      <a href="/" class="flex items-center gap-1.5 text-[13px] text-neutral-600 hover:text-black rounded-lg px-2 py-1 hover:bg-neutral-100 flex-shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>Quay lại chat</span>
      </a>
      <h1 class="text-[15px] font-semibold truncate">Hợp đồng — soát từng bước</h1>
      <a href="/contracts/ask" class="ml-auto text-[13px] text-neutral-600 hover:text-black rounded-lg px-2 py-1 hover:bg-neutral-100 flex-shrink-0">Hỏi đáp hợp đồng →</a>
    </div>
  </header>

  <main class="max-w-[1100px] mx-auto px-4 sm:px-6 py-5 space-y-4">
    <nav id="stepper" class="flex flex-wrap items-center gap-x-6 gap-y-2"></nav>
    <div id="notice" class="hidden text-[13px] rounded-xl px-3 py-2" style="background:#fff7e6;color:var(--warning-text)"></div>
    <section id="step-1" class="card p-4"></section>
    <section id="step-2" class="card p-4 hidden"></section>
    <section id="step-3" class="card p-4 hidden"></section>
  </main>
  <script src="/contract_qa.js"></script>
  <script src="/contract_page.js"></script>
</body>
</html>
