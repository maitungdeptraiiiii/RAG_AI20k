  conclusion: "Phụ lục trái hợp đồng: điều khoản phụ lục không có hiệu lực, trừ khi các bên chấp nhận (khi đó coi như sửa hợp đồng)"
  on_silence: none
  derived_from: []
  yaml_rule: "chưa có (cần phụ lục là đối tượng riêng trong hồ sơ và đối chiếu từng điều khoản với hợp đồng gốc; để sau)"
  examples:
