# Bản liệt kê rule hợp đồng giao kết với người tiêu dùng (Luật Bảo vệ quyền lợi người tiêu dùng 19/2023/QH15, hiệu lực
# 01/07/2024; NĐ 55/2024/NĐ-CP). Người soạn: Claude theo yêu cầu của Tùng (23/11) — CẦN TÙNG DUYỆT.
# Đã đọc: Luật Đ3, 21–29, 37–42, 67; NĐ 55/2024 Đ6–16. Quy định không làm rule ghi lý do ở cuối tệp.

- id: consumer.liability_exclusion
  source:
    pid: luat:19/2023/QH15#d25.k1
    quote: Hạn chế, loại trừ trách nhiệm được pháp luật quy định của tổ chức, cá nhân kinh doanh đối với người tiêu dùng, trừ trường hợp pháp luật liên quan quy định trách nhiệm đó được hạn chế, loại trừ;
  type: prohibited
  kind: void_term
  derogation: mandatory
  applies_when: Hợp đồng giao kết với người tiêu dùng, hợp đồng theo mẫu, điều kiện giao dịch chung
  facts_needed:
  - name: excludes_trader_legal_liability
    kind: bool
    from: contract
  exceptions: []
  conclusion: Bên kinh doanh không được quy định điều khoản này (Đ25.1)
  on_silence: none
  derived_from: []
  yaml_rule: consumer.liability_exclusion/r1
  examples:
  - facts:
      excludes_trader_legal_liability: false
    expected: PASS
  - facts:
      excludes_trader_legal_liability: true
    expected: FAIL
  - facts: {}
    expected: UNKNOWN
    why: bước trích chưa đọc được điều khoản
  open_questions:
  - 'Ngoại lệ ''pháp luật liên quan quy định trách nhiệm đó được hạn chế'' (vd. Đ35 miễn trách hàng khuyết tật) chưa làm rule ngoại lệ: cần dữ kiện về luật chuyên ngành.'
