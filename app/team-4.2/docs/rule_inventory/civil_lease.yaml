- id: civil_lease.landlord_no_unilateral_termination
  source:
    pid: "luat:27/2023/QH15#d172.k1"
    quote: "Trong thời hạn thuê nhà ở theo thỏa thuận trong hợp đồng, bên cho thuê không được đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở và thu hồi nhà ở đang cho thuê, trừ trường hợp quy định tại khoản 2 Điều này."
  periods:
    - {valid_from: "2015-07-01", pid: "luat:65/2014/QH13#d132.k1", quote: "Trong thời hạn thuê nhà ở theo thỏa thuận trong hợp đồng, bên cho thuê không được đơn phương chấm dứt hợp đồng thuê nhà và thu hồi nhà ở đang cho thuê, trừ các trường hợp quy định tại khoản 2 Điều này."}
    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d172.k1", quote: "Trong thời hạn thuê nhà ở theo thỏa thuận trong hợp đồng, bên cho thuê không được đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở và thu hồi nhà ở đang cho thuê, trừ trường hợp quy định tại khoản 2 Điều này."}
  type: prohibited
  kind: termination
  derogation: mandatory
  applies_when: "Hợp đồng thuê nhà ở có thời hạn"
  facts_needed:
    - {name: landlord_may_terminate_at_will, kind: bool, from: contract, note: "điều khoản cho bên cho thuê lấy lại nhà / chấm dứt bất cứ lúc nào, không cần căn cứ k2"}
  exceptions:
    - pid: "luat:27/2023/QH15#d172.k2"
      quote: "Bên cho thuê nhà ở có quyền đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở và thu hồi nhà ở đang cho thuê khi thuộc một trong các trường hợp sau đây:"
      condition: "Điều khoản chỉ cho bên cho thuê chấm dứt theo các căn cứ của k2 (nợ tiền thuê, dùng sai mục đích, tự ý cải tạo, cho thuê lại không đồng ý...)"
  conclusion: "Điều khoản cho bên cho thuê đơn phương chấm dứt / thu hồi nhà tùy ý trong thời hạn thuê trái Đ172.1"
  on_silence: none
  derived_from: []
  yaml_rule: "lease.landlord_termination/r1"
  examples:
    - {facts: {landlord_may_terminate_at_will: false}, expected: PASS}
    - {facts: {landlord_may_terminate_at_will: true}, expected: FAIL}
    - {facts: {}, expected: UNKNOWN, why: "chưa đọc được điều khoản chấm dứt"}
  open_questions: []

- id: civil_lease.nonpayment_termination_min
  source:
    pid: "luat:27/2023/QH15#d172.k2.b"
    quote: "Bên thuê không trả đủ tiền thuê nhà ở theo thỏa thuận trong hợp đồng từ 03 tháng trở lên mà không có lý do đã được thỏa thuận trong hợp đồng"
  periods:
    - {valid_from: "2015-07-01", pid: "luat:65/2014/QH13#d132.k2.b", quote: "Bên thuê không trả tiền thuê nhà ở theo thỏa thuận từ 03 tháng trở lên mà không có lý do chính đáng"}
    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d172.k2.b", quote: "Bên thuê không trả đủ tiền thuê nhà ở theo thỏa thuận trong hợp đồng từ 03 tháng trở lên mà không có lý do đã được thỏa thuận trong hợp đồng"}
  type: threshold
  kind: time_limit
  derogation: floor
  applies_when: "Hợp đồng cho bên cho thuê chấm dứt vì bên thuê chậm trả tiền thuê"
  facts_needed:
    - {name: nonpayment_months_before_termination, kind: duration, unit: month, from: contract, note: "số tháng chậm trả để bên cho thuê được chấm dứt"}
  threshold: {value: 3, unit: month}
  exceptions: []
  conclusion: "Cho bên cho thuê chấm dứt khi chậm trả dưới 03 tháng: mở rộng căn cứ của Đ172.2, trái Đ172.1"
  on_silence: none
  derived_from: [civil_lease.landlord_no_unilateral_termination]
  yaml_rule: "lease.nonpayment_termination/r1"
  examples:
    - {facts: {nonpayment_months_before_termination: 3}, expected: PASS}
    - {facts: {nonpayment_months_before_termination: 1}, expected: FAIL}
    - {facts: {}, expected: UNKNOWN, why: "điều khoản không ghi số tháng"}
  open_questions:
    - "BLDS Đ481.2 (thuê tài sản chung): chấm dứt khi không trả tiền ba kỳ liên tiếp, 'trừ trường hợp có thỏa thuận khác'. Với nhà ở dùng Luật Nhà ở (Đ472)."
    - "2014: 'không có lý do chính đáng'; 2023: 'không có lý do đã được thỏa thuận trong hợp đồng' — chưa kiểm phần lý do."

- id: civil_lease.tenant_termination_right
  source:
    pid: "luat:27/2023/QH15#d172.k3"
    quote: "Bên thuê nhà ở có quyền đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở khi thuộc một trong các trường hợp sau đây:"
