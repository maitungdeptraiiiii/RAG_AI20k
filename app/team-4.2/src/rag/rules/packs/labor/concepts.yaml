  - id: termination.employee_unilateral
    label: NLĐ đơn phương chấm dứt hợp đồng
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản về việc NLĐ tự nghỉ việc: thời hạn báo trước, điều kiện được nghỉ, phạt khi nghỉ."
    phrasing: ["đơn phương chấm dứt", "nghỉ việc phải báo trước", "xin thôi việc", "báo trước ít nhất"]
    not_about:   # lần chạy thật 14/11: câu hoàn trả phí đào tạo bị gán vào đây
      - {text: "NLĐ không tiếp tục làm việc sau đào tạo thì phải hoàn trả phí đào tạo", see: training.cost_repayment}
      - {text: "cam kết phục vụ lâu dài, thời gian phải làm việc sau khi được cử đi đào tạo", see: training.cost_repayment}
    slots:
      employee_notice: {kind: duration, unit: day}
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d35.k1", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d35.k2", role: exception, note: "các trường hợp không cần báo trước, điểm a–g"}
    rules:
      - id: r1
        mode: threshold
        cases:
          - {when: {fact: contract_kind, op: eq, value: khong_xac_dinh_thoi_han}, law: {notice: {value: 45, unit: day}}}
          - {when: {all: [{fact: contract_kind, op: eq, value: xac_dinh_thoi_han},
                          {fact: term_months, op: gte, value: 12, unit: month}]}, law: {notice: {value: 30, unit: day}}}
          - {when: {all: [{fact: contract_kind, op: eq, value: xac_dinh_thoi_han},
                          {fact: term_months, op: lt, value: 12, unit: month}]},  law: {notice: {value: 3, unit: workday}}}
        check: {fact: employee_notice, op: lte, law: notice}   # HĐ đòi báo trước dài hơn luật là hạn chế quyền
        derogation: floor
        on_silence: hidden_right
        outcome: {legality: unknown, employee_impact: unfavorable}   # cần người xem lại trước khi kết luận trái luật

