# Khái niệm hợp đồng giao kết với người tiêu dùng. Nguồn và trích dẫn: docs/rule_inventory/consumer.yaml.
# Sinh từ bảng trong lần soạn 23/11; từ nay sửa trực tiếp tệp này.
version: '0.1'
law_values_valid_from: '2024-07-01'
in_force: {earlier_contracts: conforming_only}   # Luật BVQLNTD 19/2023 Đ80.1: giao dịch trước 01/07/2024 phù hợp luật mới thì áp luật mới, khác thì áp Luật 59/2010
roles:
- id: BEN_KINH_DOANH
  label: Tổ chức, cá nhân kinh doanh
  aliases:
  - bên bán
  - bên cung cấp
  - công ty
- id: NGUOI_TIEU_DUNG
  label: Người tiêu dùng
  aliases:
  - khách hàng
  - bên mua
  - thuê bao
concepts:
- id: consumer.liability_exclusion
  kind: void_term
  label: Không hạn chế, loại trừ trách nhiệm luật định của bên kinh doanh
  scope: core
  phase: P0
  holder: NGUOI_TIEU_DUNG
  counterparty: BEN_KINH_DOANH
  applies_to: &id001
  - NGUOI_TIEU_DUNG
  describe: Điều khoản hạn chế hoặc loại trừ trách nhiệm mà pháp luật đặt cho bên kinh doanh (bảo hành, bồi thường do hàng có khuyết tật, giao đúng chất lượng...), vd. 'không chịu trách nhiệm trong mọi
    trường hợp', 'không bảo hành'.
  phrasing:
  - không chịu trách nhiệm
  - miễn trừ trách nhiệm
  - không bảo hành
  - trong mọi trường hợp
  - không bồi thường
  slots:
    excludes_trader_legal_liability:
      kind: bool
      unit: null
  anchors:
  - pid: luat:19/2023/QH15#d25.k1
    role: basis
  rules:
  - id: r1
    mode: prohibited
    derogation: mandatory
    on_silence: none
    check:
      fact: excludes_trader_legal_liability
      op: eq
      value: false
    outcome: &id002
      legality: illegal
      party_impact: unfavorable
- id: consumer.complaint_right
  kind: void_term
  label: Không hạn chế quyền khiếu nại, khởi kiện của người tiêu dùng
  scope: core
  phase: P0
  holder: NGUOI_TIEU_DUNG
  counterparty: BEN_KINH_DOANH
  applies_to: *id001
  describe: 'Điều khoản hạn chế hoặc loại bỏ quyền khiếu nại, khởi kiện của người tiêu dùng: ''không được khiếu nại sau khi nhận hàng'', ''chỉ giải quyết bằng trọng tài, không được khởi kiện ra Tòa'', thời
    hạn khiếu nại quá ngắn.'
  phrasing:
  - khiếu nại
  - khởi kiện
  - không được khiếu nại
  - trọng tài
  - từ bỏ quyền
  slots:
    restricts_consumer_complaint_or_lawsuit:
      kind: bool
      unit: null
  anchors:
  - pid: luat:19/2023/QH15#d25.k2
    role: basis
  - pid: luat:19/2023/QH15#d67.k2
    role: context
    note: 'điều khoản trọng tài trong hợp đồng mẫu: người tiêu dùng vẫn được chọn cách giải quyết khác'
  - pid: luat:54/2010/QH12#d17
    role: context
    note: 'Luật TTTM: điều khoản trọng tài trong điều kiện chung do nhà cung cấp soạn — người tiêu dùng vẫn được chọn Tòa án'
