- id: civil_lease.rent_adjustment_on_renovation
  source:
    pid: "luat:27/2023/QH15#d170.k2"
    quote: "Trường hợp bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở nếu thời gian cho thuê còn lại từ một phần ba thời hạn của hợp đồng thuê nhà ở trở xuống."
  periods:
    - {valid_from: "2015-07-01", pid: "luat:65/2014/QH13#d129.k2", quote: "Trường hợp chưa hết hạn hợp đồng thuê nhà ở mà bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở."}
    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d170.k2", quote: "Trường hợp bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở nếu thời gian cho thuê còn lại từ một phần ba thời hạn của hợp đồng thuê nhà ở trở xuống."}
  type: default
  kind: none
  derogation: default
  applies_when: "Bên cho thuê điều chỉnh giá thuê giữa kỳ"
  facts_needed:
    - {name: renovated_with_tenant_consent, kind: bool, from: dossier}
    - {name: remaining_term_share, kind: percent, from: derived, note: "thời gian còn lại / thời hạn hợp đồng, tính từ phụ lục tăng giá"}
  exceptions: []
  conclusion: "Quyền của bên cho thuê ĐỀ NGHỊ giá mới; 'giá thuê nhà ở mới do các bên thỏa thuận', không thỏa thuận được thì bên cho thuê chấm dứt và bồi thường"
  on_silence: none
  derived_from: []
  yaml_rule: "chưa có — xem open_questions"
  examples:
    - {facts: {renovated_with_tenant_consent: true, remaining_term_share: 30}, expected: PASS}
    - {facts: {renovated_with_tenant_consent: false}, expected: FAIL, note: "chỉ khi bên cho thuê áp giá mới mà bên thuê không đồng ý"}
    - {facts: {renovated_with_tenant_consent: true}, expected: UNKNOWN, why: "chưa biết thời gian thuê còn lại (2023 đòi ≤ 1/3)"}
  open_questions:
    - "Giá mới luôn do các bên thỏa thuận (k2 câu 2), nên phụ lục tăng giá có hai bên ký là hợp lệ: không có rule 'tăng giá giữa kỳ' trên hồ sơ (D37) có căn cứ. Điều khoản 'bên cho thuê đơn phương tăng giá' chưa xếp là vi phạm vì luật không nói thẳng."
    - "Khác biệt 2014/2023 (điều kiện ≤ 1/3 thời hạn còn lại) chỉ ảnh hưởng quyền chấm dứt của bên cho thuê (Đ172.2.g)."

