- id: consumer.service_suspension_notice
  source:
    pid: luat:19/2023/QH15#d41.k3
    quote: Không được đơn phương chấm dứt thực hiện hợp đồng, ngừng cung cấp dịch vụ không đúng hợp đồng hoặc trái quy định của pháp luật. Trường hợp cần sửa chữa, bảo trì hoặc vì lý do khác bắt buộc phải
      ngừng cung cấp dịch vụ, tổ chức, cá nhân kinh doanh cung cấp dịch vụ phải thông báo trước cho người tiêu dùng về thời gian ngừng cung cấp dịch vụ và thời gian cung cấp lại dịch vụ chậm nhất là 03
      ngày làm việc trước ngày ngừng cung cấp dịch vụ, trừ trường hợp bất khả kháng.
  type: prohibited
  kind: notice
  derogation: mandatory
  applies_when: Hợp đồng cung cấp dịch vụ liên tục (từ 03 tháng hoặc không xác định thời hạn, Đ3.6)
  facts_needed:
  - name: is_continuous_service
    kind: bool
    from: user
  - name: trader_may_suspend_without_notice
    kind: bool
    from: contract
  exceptions: []
  conclusion: Điều khoản cho bên cung cấp ngừng dịch vụ / chấm dứt tùy ý hoặc không báo trước 03 ngày làm việc trái Đ41.3
  on_silence: none
  derived_from: []
