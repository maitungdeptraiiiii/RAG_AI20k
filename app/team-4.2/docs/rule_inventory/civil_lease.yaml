  facts_needed:
    - {name: tenant_barred_from_unilateral_termination, kind: bool, from: contract, note: "cấm tuyệt đối, kể cả khi bên cho thuê không sửa nhà hư hỏng nặng / tăng giá bất hợp lý"}
  exceptions: []
  conclusion: "Điều khoản tước quyền chấm dứt của bên thuê trong các trường hợp Đ172.3 trái luật"
  on_silence: none
  derived_from: []
  yaml_rule: "lease.tenant_termination_right/r1"
  examples:
    - {facts: {tenant_barred_from_unilateral_termination: false}, expected: PASS}
    - {facts: {tenant_barred_from_unilateral_termination: true}, expected: FAIL}
    - {facts: {}, expected: UNKNOWN, why: "chưa đọc được điều khoản chấm dứt"}
  open_questions:
    - "Đ172.3 trao quyền nhưng không nói rõ điều khoản từ bỏ quyền này vô hiệu; xếp 'mandatory' là cách đọc của người soạn, cần Tùng duyệt."
    - "Điều khoản chỉ cấm chấm dứt 'tùy ý' (ngoài các trường hợp k3) thì hợp lệ: slot chỉ true khi cấm trong MỌI trường hợp."

- id: civil_lease.termination_notice
  source:
    pid: "luat:27/2023/QH15#d172.k4"
    quote: "Bên đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở phải thông báo bằng văn bản hoặc bằng hình thức khác theo thỏa thuận trong hợp đồng cho bên kia biết trước ít nhất 30 ngày, trừ trường hợp các bên có thỏa thuận khác"
  periods:
    - {valid_from: "2015-07-01", pid: "luat:65/2014/QH13#d132.k4", quote: "Bên đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở phải thông báo cho bên kia biết trước ít nhất 30 ngày, trừ trường hợp các bên có thỏa thuận khác"}
    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d172.k4", quote: "Bên đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở phải thông báo bằng văn bản hoặc bằng hình thức khác theo thỏa thuận trong hợp đồng cho bên kia biết trước ít nhất 30 ngày, trừ trường hợp các bên có thỏa thuận khác"}
  type: default
  kind: notice
  derogation: default
  applies_when: "Một bên đơn phương chấm dứt hợp đồng thuê nhà ở"
  facts_needed:
    - {name: notice_days, kind: duration, unit: day, from: contract}
    - {name: notice_agreed_in_contract, kind: bool, from: contract}
  threshold: {value: 30, unit: day}
  exceptions: []
  conclusion: "Báo trước 30 ngày là mặc định; các bên được thỏa thuận khác nên điều khoản ghi ngắn hơn KHÔNG trái luật"
  on_silence: default_applies
  derived_from: []
  yaml_rule: "chưa có (luật mặc định, hợp đồng ghi khác vẫn hợp lệ; chỉ là sự kiện khi một bên chấm dứt mà không báo)"
  examples:
    - {facts: {notice_days: 15, notice_agreed_in_contract: true}, expected: PASS}
    - {facts: {notice_days: 10, notice_agreed_in_contract: false}, expected: FAIL, note: "sự kiện chấm dứt thực tế, không phải điều khoản"}
    - {facts: {notice_days: 10}, expected: UNKNOWN, why: "chưa biết thời hạn báo trước có do hợp đồng thỏa thuận không"}
  open_questions: []

- id: civil_lease.rent_adjustment_on_renovation
  source:
    pid: "luat:27/2023/QH15#d170.k2"
    quote: "Trường hợp bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở nếu thời gian cho thuê còn lại từ một phần ba thời hạn của hợp đồng thuê nhà ở trở xuống."
  periods:
    - {valid_from: "2015-07-01", pid: "luat:65/2014/QH13#d129.k2", quote: "Trường hợp chưa hết hạn hợp đồng thuê nhà ở mà bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở."}
    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d170.k2", quote: "Trường hợp bên cho thuê thực hiện cải tạo nhà ở và được bên thuê đồng ý thì bên cho thuê được quyền điều chỉnh giá thuê nhà ở nếu thời gian cho thuê còn lại từ một phần ba thời hạn của hợp đồng thuê nhà ở trở xuống."}
  type: default
  kind: none
  derogation: default
  applies_when: "Bên cho thuê điều chỉnh giá thuê giữa kỳ"
  facts_needed:
    - {name: renovated_with_tenant_consent, kind: bool, from: dossier}
    - {name: remaining_term_share, kind: percent, from: derived, note: "thời gian còn lại / thời hạn hợp đồng, tính từ phụ lục tăng giá"}
  exceptions: []
  conclusion: "Quyền của bên cho thuê ĐỀ NGHỊ giá mới; 'giá thuê nhà ở mới do các bên thỏa thuận', không thỏa thuận được thì bên cho thuê chấm dứt và bồi thường"
  on_silence: none
  derived_from: []
  yaml_rule: "chưa có — xem open_questions"
  examples:
    - {facts: {renovated_with_tenant_consent: true, remaining_term_share: 30}, expected: PASS}
    - {facts: {renovated_with_tenant_consent: false}, expected: FAIL, note: "chỉ khi bên cho thuê áp giá mới mà bên thuê không đồng ý"}
    - {facts: {renovated_with_tenant_consent: true}, expected: UNKNOWN, why: "chưa biết thời gian thuê còn lại (2023 đòi ≤ 1/3)"}
  open_questions:
    - "Giá mới luôn do các bên thỏa thuận (k2 câu 2), nên phụ lục tăng giá có hai bên ký là hợp lệ: không có rule 'tăng giá giữa kỳ' trên hồ sơ (D37) có căn cứ. Điều khoản 'bên cho thuê đơn phương tăng giá' chưa xếp là vi phạm vì luật không nói thẳng."
    - "Khác biệt 2014/2023 (điều kiện ≤ 1/3 thời hạn còn lại) chỉ ảnh hưởng quyền chấm dứt của bên cho thuê (Đ172.2.g)."

