    term: ["12 tháng", "Thời hạn vay là 12 tháng kể từ ngày nhận tiền."]
    loan_interest: ["Lãi suất vay là 1%/tháng", "Lãi suất vay là 1%/tháng"]
  slots:
    loan.interest_cap: {interest_rate: ["1%/tháng", "Lãi suất vay là 1%/tháng"]}
