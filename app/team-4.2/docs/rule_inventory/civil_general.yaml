    quote: "Trường hợp luật quy định giao dịch dân sự phải được thể hiện bằng văn bản có công chứng, chứng thực, đăng ký thì phải tuân theo quy định đó."
  type: required
  kind: none
  derogation: mandatory
  applies_when: "Loại hợp đồng mà luật chuyên ngành bắt buộc công chứng / chứng thực / đăng ký (vd. một số giao dịch nhà ở)"
  facts_needed:
    - {name: form_requirement, kind: enum, from: user, note: "luật chuyên ngành của loại hợp đồng"}
    - {name: notarized, kind: bool, from: contract}
  exceptions: []
  conclusion: "Thiếu công chứng / chứng thực / đăng ký mà luật bắt buộc thì vi phạm điều kiện hình thức"
  on_silence: none
  derived_from: []
  yaml_rule: "chưa có (luật chuyên ngành; thuê nhà ở: Luật Nhà ở 27/2023 Đ164.2 không bắt buộc công chứng, xem civil_lease.yaml)"
  examples:
    - {facts: {form_requirement: notarized, notarized: true}, expected: PASS}
    - {facts: {form_requirement: notarized, notarized: false}, expected: FAIL}
    - {facts: {notarized: false}, expected: UNKNOWN, why: "chưa biết luật có bắt buộc công chứng loại hợp đồng này không"}
  open_questions:
    - "Hình thức chung theo Đ119.1 là tự do (lời nói, văn bản, hành vi); chỉ kiểm được khi biết luật chuyên ngành đòi hình thức gì."

- id: civil.appendix_not_contrary
