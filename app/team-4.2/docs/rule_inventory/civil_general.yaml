# Bản liệt kê rule dân sự chung về hợp đồng (phần Tuấn, T2; BLDS 91/2015/QH13).
# Chỉ lấy quy định kiểm được trên văn bản hợp đồng. Người soạn: Claude theo yêu cầu của Tùng — CẦN TÙNG DUYỆT.
# Mở rộng 23/11 (xây gói đầy đủ): đã đọc BLDS Đ385–429 và Đ351–357; quy định không làm rule ghi lý do ở cuối tệp.

- id: civil.form_required_by_law
