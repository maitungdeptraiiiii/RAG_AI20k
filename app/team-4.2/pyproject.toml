[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-team-4-2"
version = "0.1.0"
description = "Team 4.2 — Baseline Hybrid RAG (BM25 + Dense + RRF) cho văn bản luật tiếng Việt"
requires-python = ">=3.12"
# Danh sách theo docs/tech_stack.md mục 5.2. Chốt version bằng lockfile khi baseline chạy ổn.
dependencies = [
    "pymupdf",
    "python-docx>=1.1",  # loader DOCX (cần Document.iter_inner_content)
    "trafilatura",
    "requests",          # crawler vbpl.vn
    "beautifulsoup4",    # crawler vbpl.vn: HTML -> text
    "pyvi",
    "openai",
    "qdrant-client",
    "streamlit",
    "pandas",
    "pyyaml",            # rag.legal: seeds.yaml
    "filelock",          # rag.legal.snapshots: khoá ghi kho luật
    "ragas",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]                 # RERANK_BACKEND=jev
neural = ["torch", "transformers"]    # ADVANCED=splade / colbert
dev = ["pytest", "pytest-asyncio"]   # tests/test_stream.py dùng @pytest.mark.asyncio

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"rag.contracts.graph" = ["schema.json"]
