# Danh mục khái niệm hợp đồng lao động (tầng 1) - BẢN NHÁP 2, 2026-11-14
#
# Đây là khóa chung giữa đồ thị hợp đồng và đồ thị luật: hai bên gặp nhau ở `id` của khái niệm.
# Thiết kế: docs/superpowers/specs/2026-11-14-legal-graph-concept-layer-design.md (phía luật)
#           docs/superpowers/specs/2026-11-14-contract-concept-check-design.md (phía hợp đồng)
# Bộ nạp và kiểm: src/rag/rules/loader.py (sai định dạng thì dừng, báo hết lỗi).
#
# AI LÀM GÌ
#   A  (Tùng): viết khái niệm, `describe`, `phrasing`, `slots`, `rules`. Phía hợp đồng và rule engine đọc các trường này.
#   LU (Huy):  rà và chốt `anchors` + `value_sources` của từng khái niệm, rồi dựng lớp Concept trong đồ thị luật.
#              Đồ thị luật CHỈ đọc: roles, và với mỗi khái niệm: id, label, scope, phase, applies_to, anchors,
#              value_sources. Các trường khác bỏ qua.
#
# VIỆC CỦA LU VỚI FILE NÀY
#   1. Với từng khái niệm: neo đã đúng điều / khoản / điểm chưa? Thiếu ngoại lệ nào không?
#      Sửa thẳng vào file. Neo nào không chắc thì thêm `note:` vào neo đó.
#   2. Khái niệm nào cần giá trị từ văn bản dưới luật (lương vùng, tỉ lệ đóng bảo hiểm...) thì thêm `value_sources`.
#   3. Không cần neo văn bản hướng dẫn (NĐ 145/2020, TT 10/2020): đồ thị tự tìm qua `guidance()`.
#   4. Thấy thiếu khái niệm quan trọng thì thêm vào mục ĐỀ XUẤT ở cuối file, không tự thêm vào danh sách chính.
#   5. Giá trị số trong `rules` chép từ BLLĐ 45/2019 bản gốc. Nếu văn bản sửa đổi đã đổi giá trị nào, ghi `note:`.
#
# ĐỊNH DẠNG
#   pid neo:      <document_key>#d<điều>.k<khoản>.<điểm>   (theo rag.legal.keys.provision_id)
#                 ví dụ bo-luat:45/2019/QH14#d35.k2.đ ; neo cả Điều thì chỉ ghi #d113
#   role của neo: basis     = điều khoản đặt ra quyền / nghĩa vụ / ngưỡng
#                 exception = điều khoản loại trừ hoặc ghi đè
#   value_sources: document_key của văn bản chứa giá trị đổi theo thời kỳ (đồ thị chọn văn bản hiệu lực theo ngày)
#   scope:        core (dùng để soát hợp đồng) | supporting (chỉ để giải thích) | out_of_scope
#   phase:        P0 (làm ngay) | P1 (lao động nữ; bản đầu chỉ báo "có thể có quyền")
#
#   describe / phrasing: gửi cho LLM để nhận diện điều khoản. Không ghi ngưỡng luật vào đây.
#   slots:        giá trị LLM phải trích khi gặp khái niệm. kind: duration | percent | money | bool | enum.
#                 unit: day | workday | week | month | hour | minute | percent | vnd | count.
#
#   rules[].mode:        required  = hợp đồng phải ghi nội dung này
#                        threshold = hợp đồng ghi con số, so với ngưỡng luật
#                        prohibited= hợp đồng không được có điều khoản này
#                        default   = luật tự áp dụng dù hợp đồng không ghi
#   rules[].derogation:  floor     = được thỏa thuận có lợi hơn cho NLĐ
#                        mandatory = không được thỏa thuận khác
#                        default   = các bên được thỏa thuận khác
#   rules[].on_silence:  missing_content = báo thiếu nội dung bắt buộc
#                        hidden_right    = báo quyền mà hợp đồng không nhắc
#                        none            = không báo gì
#   law:          {tên: {value, unit}}; theo kỳ: {tên: {by: <dữ kiện>, unit, periods: [{valid_from, values, source}]}}
#   cases[].when / applicability: {fact, op, value[, unit]}, lồng bằng all / any / not.
#                 op thuộc eq | lte | gte | lt | gt | in | present | absent
#   check: {fact, op, law: <tên giá trị luật>} hoặc {fact, op, value}; lồng bằng all.
#          Thiếu dữ kiện thì kết quả là UNKNOWN, không FAIL.

version: "0.2-draft"
law_values_valid_from: "2021-01-01"   # ngày BLLĐ 45/2019 có hiệu lực; áp cho mọi giá trị không theo kỳ

roles:
  - {id: NLD,                     label: "Người lao động"}
  - {id: NSDLD,                   label: "Người sử dụng lao động"}
  - {id: NLD_nu,                  label: "Lao động nữ",                          subtype_of: NLD}
  - {id: NLD_mang_thai,           label: "Lao động nữ mang thai",                subtype_of: NLD_nu}
  - {id: NLD_nuoi_con_duoi_12t,   label: "Người lao động nuôi con dưới 12 tháng tuổi", subtype_of: NLD}
  - {id: NLD_nghi_thai_san,       label: "Người lao động nghỉ thai sản",         subtype_of: NLD}

concepts:

  # ───────────── 1. NỘI DUNG BẮT BUỘC CỦA HỢP ĐỒNG (Đ21 k1) ─────────────

  - id: content.party_info
    label: Thông tin hai bên giao kết
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Tên, địa chỉ NSDLĐ và người ký thay; họ tên, ngày sinh, giới tính, nơi cư trú, số giấy tờ của NLĐ."
    phrasing: ["Chúng tôi, một bên là", "đại diện", "Sinh ngày", "Số CCCD", "Địa chỉ thường trú"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.a", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d21.k1.b", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: neutral}}

  - id: content.job_and_workplace
    label: Công việc và địa điểm làm việc
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi công việc phải làm, chức danh, và nơi làm việc."
    phrasing: ["Địa điểm làm việc", "Chức danh chuyên môn", "Công việc phải làm", "Bộ phận công tác"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.c", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d28", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.term
    label: Loại và thời hạn hợp đồng
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi hợp đồng không xác định thời hạn hay xác định thời hạn, ngày bắt đầu, ngày kết thúc."
    phrasing: ["Loại hợp đồng lao động", "Thời hạn hợp đồng", "xác định thời hạn", "Từ ngày", "đến ngày"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.d", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d20.k1", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d20.k2", role: basis, note: "hết hạn mà vẫn làm việc: ký mới trong 30 ngày, quá hạn thành HĐ không xác định thời hạn"}
      - {pid: "bo-luat:45/2019/QH14#d20.k2.b", role: basis, note: "kết luận trung gian contract_kind_effective (pack.yaml, derived); rule r4"}
      - {pid: "bo-luat:45/2019/QH14#d20.k2.c", role: basis, note: "chỉ được ký thêm 01 lần HĐ xác định thời hạn; rule r3"}
      - {pid: "bo-luat:45/2019/QH14#d149.k1", role: exception, note: "người lao động cao tuổi: ký nhiều lần; rule r3_elderly"}
      - {pid: "bo-luat:45/2019/QH14#d151.k2", role: exception, note: "người lao động nước ngoài: ký nhiều lần; rule r3_foreign"}
      - {pid: "bo-luat:45/2019/QH14#d177.k4", role: exception, note: "ban lãnh đạo tổ chức đại diện NLĐ tại cơ sở: gia hạn đến hết nhiệm kỳ; rule r3_union_leader"}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}
      - id: r2
        mode: threshold
        applicability: {fact: contract_kind, op: eq, value: xac_dinh_thoi_han}
        law: {max_term: {value: 36, unit: month}}
        check: {fact: term_months, op: lte, law: max_term}
        derogation: mandatory
        on_silence: none
        outcome: {legality: illegal, employee_impact: unfavorable}
      # Điều 20.2.c: ngoài hợp đồng đầu, chỉ được ký thêm 01 lần hợp đồng xác định thời hạn (tối đa 2 hợp đồng liên tiếp).
      # Nguồn của `fixed_term_contract_count` là người dùng; giai đoạn 7 thay bằng phép đếm đối tượng, không đổi rule.
      - id: r3
        mode: threshold
        applicability: {fact: contract_kind, op: eq, value: xac_dinh_thoi_han}
        law: {max_fixed_term_contracts: {value: 2, unit: null}}
        check: {fact: fixed_term_contract_count, op: lte, law: max_fixed_term_contracts}
        derogation: mandatory
        on_silence: none
        outcome: {legality: illegal, employee_impact: unfavorable}
      # Bốn ngoại lệ ghi tại cuối Điều 20.2.c; rule nào áp dụng thì r3 không áp dụng (spec §5.4).
      - {id: r3_state_director, mode: required, derogation: mandatory, on_silence: none, exception_of: content.term/r3,
         applicability: {fact: is_state_enterprise_director, op: eq, value: true},
         outcome: {legality: illegal, employee_impact: unfavorable}}
      - {id: r3_elderly, mode: required, derogation: mandatory, on_silence: none, exception_of: content.term/r3,
         applicability: {fact: is_elderly_employee, op: eq, value: true},
         outcome: {legality: illegal, employee_impact: unfavorable}}
      - {id: r3_foreign, mode: required, derogation: mandatory, on_silence: none, exception_of: content.term/r3,
         applicability: {fact: is_foreign_employee, op: eq, value: true},
         outcome: {legality: illegal, employee_impact: unfavorable}}
      - {id: r3_union_leader, mode: required, derogation: mandatory, on_silence: none, exception_of: content.term/r3,
         applicability: {fact: is_union_leader_in_term, op: eq, value: true},
         outcome: {legality: illegal, employee_impact: unfavorable}}
      # Điều 20.2.b: hợp đồng đã trở thành không xác định thời hạn theo luật mà văn bản vẫn ghi loại khác thì cần soát lại
      # (không phải hợp đồng trái luật: legality `unknown`, employee_impact `neutral`).
      - id: r4
        mode: required
        applicability: {fact: contract_kind_effective, op: eq, value: khong_xac_dinh_thoi_han}
        check: {fact: contract_kind, op: eq, value: khong_xac_dinh_thoi_han}
        derogation: mandatory
        on_silence: none
        outcome: {legality: unknown, employee_impact: neutral}

  - id: content.wage_terms
    label: Mức lương, hình thức trả, thời hạn trả, phụ cấp
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi mức lương theo công việc hoặc chức danh, hình thức trả, kỳ trả lương, phụ cấp và khoản bổ sung."
    phrasing: ["Mức lương chính", "Lương căn bản", "Phụ cấp", "Hình thức trả lương", "Thời hạn trả lương"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.đ", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d90.k1", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.raise_policy
    label: Chế độ nâng bậc, nâng lương
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản về điều kiện, thời điểm xét nâng lương hoặc nâng bậc."
    phrasing: ["Chế độ nâng bậc", "nâng lương", "xét tăng lương", "điều chỉnh lương"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.e", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d103", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.hours_rest
    label: Thời giờ làm việc, thời giờ nghỉ ngơi
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi giờ làm mỗi ngày, mỗi tuần, ca làm, ngày nghỉ."
    phrasing: ["Thời giờ làm việc", "giờ/ngày", "giờ/tuần", "Thời giờ nghỉ ngơi", "ca làm việc"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.g", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.protective_equipment
    label: Trang bị bảo hộ lao động
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản về việc cấp phát trang bị, phương tiện bảo hộ lao động."
    phrasing: ["Phương tiện bảo hộ lao động", "trang bị bảo hộ", "được cấp phát", "đồ bảo hộ"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.h", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.insurance
    label: Bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản về việc tham gia và đóng BHXH, BHYT, BHTN; kể cả điều khoản thỏa thuận không đóng."
    phrasing: ["Bảo hiểm xã hội", "bảo hiểm y tế", "bảo hiểm thất nghiệp", "BHXH", "trích đóng"]
    slots:
      waives_compulsory_insurance: {kind: bool, unit: null}
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.i", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d168.k1", role: basis, note: "A chưa đối chiếu nguyên văn"}
    value_sources:
      - {document_key: "luat:41/2024/QH15", note: "Luật BHXH 2024, từ 01/7/2025; trước đó là luat:58/2014/QH13"}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: unfavorable}}
      - {id: r2, mode: prohibited, derogation: mandatory, on_silence: none,
         check: {fact: waives_compulsory_insurance, op: eq, value: false},
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: content.training
    label: Đào tạo, bồi dưỡng, nâng cao trình độ
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản về đào tạo, bồi dưỡng kỹ năng nghề cho người lao động."
    phrasing: ["Đào tạo", "bồi dưỡng", "nâng cao trình độ", "kỹ năng nghề"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d21.k1.k", role: basis}
    rules:
      - {id: r1, mode: required, derogation: mandatory, on_silence: missing_content,
         outcome: {legality: illegal, employee_impact: neutral}}

  # ───────────── 2. THỬ VIỆC (Đ24–27) ─────────────

  - id: probation.duration
    label: Thời gian thử việc tối đa
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi thời gian thử việc (số ngày hoặc số tháng)."
    phrasing: ["Thời gian thử việc", "thử việc trong", "thời hạn thử việc", "tháng thử việc"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d25", role: basis}
      - {pid: "bo-luat:45/2019/QH14#d24.k3", role: exception, note: "HĐ dưới 01 tháng không được thử việc"}
    rules:
      - id: r1
        mode: threshold
        applicability: {fact: has_probation, op: eq, value: true}
        cases:
          - {when: {fact: job_level, op: eq, value: quan_ly_doanh_nghiep}, law: {max_probation: {value: 180, unit: day}}}
          - {when: {fact: job_level, op: eq, value: cao_dang_tro_len},     law: {max_probation: {value: 60, unit: day}}}
          - {when: {fact: job_level, op: eq, value: trung_cap_ky_thuat},   law: {max_probation: {value: 30, unit: day}}}
          - {when: {fact: job_level, op: eq, value: cong_viec_khac},       law: {max_probation: {value: 6, unit: workday}}}
        check: {fact: probation_length, op: lte, law: max_probation}
        derogation: floor
        on_silence: none
        outcome: {legality: illegal, employee_impact: unfavorable}

  - id: probation.once
    label: Chỉ thử việc một lần cho một công việc
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản cho phép gia hạn thử việc, thử việc lần hai, hoặc kéo dài thử việc cho cùng công việc."
    phrasing: ["gia hạn thử việc", "kéo dài thời gian thử việc", "thử việc lần", "thử việc thêm"]
    slots:
      allows_probation_extension: {kind: bool, unit: null}
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d25", role: basis, note: "nằm ở đoạn mở đầu của Điều; LU xem có pid riêng cho đoạn này không"}
    rules:
      - {id: r1, mode: prohibited, derogation: mandatory, on_silence: none,
         check: {fact: allows_probation_extension, op: eq, value: false},
         outcome: {legality: illegal, employee_impact: unfavorable}}

  - id: probation.pay
    label: Tiền lương thử việc tối thiểu
    scope: core
    phase: P0
    holder: NLD
    counterparty: NSDLD
    applies_to: [NLD]
    describe: "Điều khoản ghi mức lương hoặc tỉ lệ lương trong thời gian thử việc."
    phrasing: ["lương thử việc", "trong thời gian thử việc được hưởng", "% mức lương", "lương trong thời gian thử việc"]
    anchors:
      - {pid: "bo-luat:45/2019/QH14#d26", role: basis}
    rules:
      - id: r1
        mode: threshold
        applicability: {fact: has_probation, op: eq, value: true}
        law: {min_probation_pay: {value: 85, unit: percent}}
        check: {fact: probation_pay_pct, op: gte, law: min_probation_pay}
        derogation: floor
        on_silence: hidden_right
        outcome: {legality: illegal, employee_impact: unfavorable}

  - id: probation.cancel_no_notice
    label: Hủy bỏ thử việc không cần báo trước, không bồi thường
    scope: core
    phase: P0
