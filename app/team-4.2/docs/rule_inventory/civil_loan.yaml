  threshold: {value: 20, unit: percent_per_year}
  exceptions: []
  conclusion: "Lãi của họ cũng chịu trần Đ468.1"
  on_silence: none
  derived_from: [civil_loan.interest_cap]
  yaml_rule: "ngoài phạm vi W04 (không có hợp đồng mẫu)"
  examples:
    - {facts: {interest_rate: 15}, expected: PASS}
    - {facts: {interest_rate: 30}, expected: FAIL}
    - {facts: {}, expected: UNKNOWN, why: "không có dữ kiện lãi"}
  open_questions: []

- id: civil_loan.interest_cap_blds2005
  source:
    pid: "bo-luat:33/2005/QH11#d476.k1"
    quote: "Lãi suất vay do các bên thoả thuận nhưng không được vượt quá 150% của lãi suất cơ bản do Ngân hàng Nhà nước công bố đối với loại cho vay tương ứng."
  type: threshold
  kind: rate_cap
  derogation: ceiling
  applies_when: "Hợp đồng vay không phải hợp đồng tín dụng, xác lập trước 01/01/2017"
  facts_needed:
    - {name: interest_rate, kind: percent, unit: percent_per_year, from: contract}
    - {name: sign_date, kind: date, from: contract}
  threshold: {value: 13.5, unit: percent_per_year, note: "150% × lãi suất cơ bản 9%/năm (QĐ 2868/QĐ-NHNN, áp dụng từ 01/12/2010) theo ví dụ 1 Đ2 NQ 01/2019"}
  exceptions:
    - pid: "nghi-quyet:01/2019/NQ-HĐTP#d2.k1"
      quote: "quy định mức lãi suất cơ bản là 9%/năm, tương ứng với mức 150% lãi suất cơ bản là 13,5%/năm"
      condition: "Nguồn của con số 13,5%/năm (lãi suất cơ bản 9%/năm theo QĐ 2868/QĐ-NHNN)"
  conclusion: "Hợp đồng vay xác lập trước 01/01/2017 với lãi vượt 150% lãi suất cơ bản là vượt trần BLDS 2005"
  on_silence: none
  derived_from: []
  yaml_rule: "loan.interest_cap/r1 (giá trị luật theo kỳ: từ 01/12/2010 13,5; từ 01/01/2017 20)"
  examples:
    - {facts: {interest_rate: 12, sign_date: "2016-06-01"}, expected: PASS}
    - {facts: {interest_rate: 15, sign_date: "2016-06-01"}, expected: FAIL}
