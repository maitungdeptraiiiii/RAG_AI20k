    - {valid_from: "2024-08-01", pid: "luat:27/2023/QH15#d172.k3", quote: "Bên thuê nhà ở có quyền đơn phương chấm dứt thực hiện hợp đồng thuê nhà ở khi thuộc một trong các trường hợp sau đây:"}
  type: prohibited
  kind: termination
  derogation: mandatory
