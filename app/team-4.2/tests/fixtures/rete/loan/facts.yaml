# Dữ kiện mà bước trích (facts.py + tagger) phải lấy được từ từng hợp đồng vay mẫu, kèm câu trích nguyên văn.
# Dùng để chạy engine mà không cần LLM thật; giá trị slot ghi ĐÚNG như chữ trong hợp đồng để thử cả bộ đọc đơn vị.
# document: trường trích (candidates của facts.py) -> [giá trị, câu trích]. slots: khái niệm -> slot -> [chữ, câu trích].
