# Dữ kiện mà bước trích (facts.py + tagger) phải lấy được từ từng hợp đồng thuê nhà mẫu, kèm câu trích nguyên văn.
# document: trường trích (candidates của facts.py) -> [giá trị, câu trích]. slots: khái niệm -> slot -> [chữ, câu trích];
# khái niệm nội dung bắt buộc không có slot ({}), câu trích ở present_quotes.
t1_hop_le:
  sign_date: 2025-03-01
  document:
    value: ["8.000.000 đồng", "Giá thuê nhà là 8.000.000 đồng/tháng."]
    term: ["12 tháng", "Thời hạn thuê là 12 tháng."]
  slots:
    lease.content_property: {}
    lease.content_rent_payment: {}
    lease.content_term_handover: {}
    lease.landlord_termination:
      landlord_may_terminate_at_will: [false, "Trong thời hạn thuê, Bên A không được đơn phương chấm dứt hợp đồng, trừ các trường hợp pháp luật về nhà ở cho phép."]
