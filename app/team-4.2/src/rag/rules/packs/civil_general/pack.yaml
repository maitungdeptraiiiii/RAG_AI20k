# Gói luật dân sự chung (BLDS 91/2015/QH13, phần chung về hợp đồng). Gói chuyên biệt extends gói này.
# Thiết kế: docs/superpowers/specs/2026-11-22-rete-rule-engine-design.md §5.5.
id: civil_general
version: "0.1"
extends: []
document_kinds: [civil_contract]
document_labels: {civil_contract: "hợp đồng dân sự"}   # tên loại văn bản trong prompt

units: [day, hour, month, year, vnd, percent, percent_per_year, percent_per_month, count]
# Cùng bảng với gói labor cho đơn vị dùng chung (gộp hai gói không xung đột); tháng 30 ngày, năm 360 ngày.
conversions:
  hour:  {base: hour, factor: 1}
  day:   {base: hour, factor: 24}
  month: {base: hour, factor: 720}
  year:  {base: hour, factor: 8640}
  percent_per_year:  {base: percent_per_year, factor: 1}
  percent_per_month: {base: percent_per_year, factor: 12}

# Hai dữ kiện dưới đây do LLM tìm dấu hiệu trong hợp đồng (`flag`: có câu trích thì là true). Không có dấu hiệu thì để trống
# (không suy ra "không"), rule ở trạng thái UNKNOWN và câu hỏi gợi ý hỏi người dùng (user_fact_questions).
document_facts:
  is_adhesion_contract: {unit: null, from: adhesion_signal, parse: flag}
  uses_general_conditions: {unit: null, from: general_conditions_signal, parse: flag}

extract_fields:
  - {key: adhesion_signal, label: "Dấu hiệu hợp đồng theo mẫu", kind: text,
     hint: "chép câu cho thấy hợp đồng do một bên soạn sẵn để bên kia chỉ chấp nhận, không thương lượng từng điều khoản; không có câu nào nói rõ thì bỏ qua"}
  - {key: general_conditions_signal, label: "Dấu hiệu điều kiện giao dịch chung", kind: text,
     hint: "chép câu cho thấy hợp đồng áp dụng điều kiện giao dịch chung do một bên công bố sẵn để dùng cho nhiều khách hàng; không có câu nào nói rõ thì bỏ qua"}

# Cách viết đơn vị ngay sau con số trong hợp đồng (bộ đọc slot dùng, không đoán): "30%/năm", "1,5% mỗi tháng".
unit_forms:
  percent_per_year: ["/năm", "/ năm", "một năm", "mỗi năm", "/1 năm", "trên năm"]
  percent_per_month: ["/tháng", "/ tháng", "một tháng", "mỗi tháng", "/1 tháng", "trên tháng"]

# Dữ kiện người dùng xác nhận.
user_facts:
  - special_law_applies    # có luật chuyên ngành quy định khác (vd. tổ chức tín dụng) mà BLDS cho phép (Đ468.1)
  - is_adhesion_contract   # hợp đồng theo mẫu do một bên soạn sẵn (BLDS Đ405)
  - uses_general_conditions  # hợp đồng áp điều kiện giao dịch chung do một bên công bố (BLDS Đ406)
user_fact_questions:
  is_adhesion_contract:
    question: "Hợp đồng này có phải hợp đồng theo mẫu do một bên soạn sẵn để bên kia chỉ chấp nhận hoặc không (không thương lượng từng điều khoản) không?"
    values: [true, false]
  uses_general_conditions:
    question: "Hợp đồng có áp dụng điều kiện giao dịch chung do một bên công bố sẵn để dùng chung cho mọi khách hàng không?"
    values: [true, false]
  special_law_applies:
    question: "Giao dịch này có chịu một luật chuyên ngành quy định mức khác với Bộ luật Dân sự không (ví dụ cho vay của tổ chức tín dụng)?"
    values: [true, false]

findings: []

# Nhãn hiển thị (D34). Chờ Tùng duyệt chữ.
labels:
  facts:
    special_law_applies: "Giao dịch chịu luật chuyên ngành quy định khác Bộ luật Dân sự"
    is_adhesion_contract: "Hợp đồng theo mẫu do một bên soạn sẵn"
    uses_general_conditions: "Áp dụng điều kiện giao dịch chung do một bên công bố"
