    - {facts: {late_interest_rate: [2, null]}, expected: UNKNOWN, why: "không ghi theo tháng hay theo năm"}
  open_questions:
    - "Chuyển từ gói vay (loan.late_interest_cap, 23/11) lên gói chung vì Đ357 áp cho mọi nghĩa vụ trả tiền; nhãn gold của hợp đồng vay chỉ đổi tên rule."
    - "Phạt vi phạm khi chậm thanh toán (Đ418) KHÔNG phải lãi chậm trả: BLDS không đặt trần phạt; khái niệm chỉ nhận câu nói 'lãi'."

# ── Quy định đã đọc nhưng KHÔNG làm rule (không kiểm được trên văn bản hợp đồng, hoặc chỉ là quy tắc mặc định / giải thích) ──
# Đ385–397, 399–400 (giao kết, đề nghị, chấp nhận): quá trình giao kết, không phải nội dung hợp đồng.
# Đ398 (nội dung "có thể có"): không bắt buộc.
# Đ401.1 (hiệu lực từ giao kết, trừ thỏa thuận khác): mặc định.
# Đ404 (giải thích hợp đồng), Đ405.2: quy tắc giải thích khi tranh chấp, không có vi phạm.
# Đ405.1, Đ406.2 (công khai mẫu / điều kiện chung): sự kiện ngoài văn bản.
# Đ407–408 (vô hiệu, đối tượng không thực hiện được): cần sự kiện ngoài văn bản.
# Đ409–417 (thực hiện, hoãn, cầm giữ, người thứ ba): quyền mặc định hoặc sự kiện khi thực hiện.
# Đ419, 420.4 (bồi thường, hoàn cảnh thay đổi): xảy ra khi thực hiện; Đ420.4 "trừ có thỏa thuận khác".
# Đ422, 424–427 (chấm dứt, hủy bỏ do chậm / không thực hiện / mất tài sản, hậu quả): sự kiện khi thực hiện.
# Đ429 (thời hiệu 03 năm): BLDS không có câu cấm thỏa thuận khác về thời hiệu trong phần đã đọc; chưa làm rule.
# Đ351.2 (bất khả kháng, "trừ có thỏa thuận khác"): mặc định.
