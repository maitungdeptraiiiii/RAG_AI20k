# Bản liệt kê rule hợp đồng thuê nhà ở (phần Tuấn, T6). Miền thứ ba của định hướng W04 "phủ rộng nhiều loại hợp đồng".
# Người soạn: Claude theo yêu cầu của Tùng — Tùng đã duyệt 23/11 (xem đầu labor_w04.yaml). Quote kiểm bằng tests/test_rule_inventory.py.
# Nguồn: BLDS 91/2015/QH13 Đ472–482 (thuê tài sản, luật chung); Luật Nhà ở 65/2014/QH13 (hiệu lực 01/07/2015) Đ121, 122,
# 129, 132; Luật Nhà ở 27/2023/QH15 Đ163, 164, 170, 172. Luật 27/2023 có hiệu lực từ 01/08/2024 (Luật 43/2024/QH15 Đ2
# sửa khoản 1 Điều 197, trước đó là 01/01/2025).
# BLDS Đ472: "Hợp đồng thuê nhà ở ... được thực hiện theo quy định của Bộ luật này, Luật nhà ở" — quy định riêng của Luật
# Nhà ở được ưu tiên cho nhà ở. `periods`: cùng quy định ở bản luật trước, kỳ cuối là `source` (soát theo ngày ký).
# Rà đủ 23/11 (xây gói đầy đủ): Luật Nhà ở 2023 Đ163–164, 170, 172–173; BLDS Đ472–482. Thêm 4 mục cuối tệp (CẦN TÙNG DUYỆT).

